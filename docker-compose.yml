# Avvia l'API e il database property-graph usato dal checker.
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/nis2-local-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p nis2-local-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NIS2_NEO4J_URI: bolt://neo4j:7687
      NIS2_NEO4J_USERNAME: neo4j
      NIS2_NEO4J_PASSWORD: nis2-local-password
      NIS2_NEO4J_DATABASE: neo4j
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports

volumes:
  neo4j-data:
